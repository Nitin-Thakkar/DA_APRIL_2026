<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArrayDemo</title>
</head>
<script>
    function arrayDemo()
    {
        var name1= "Bijal";
        var name2= "jyoti";

        var name = ["Bijal","Jyoti","Dhatri","Maitrey","Sohan","Astha","Nitin"];
        console.log(name[4]);

        console.log("Total Values :"+name.length);
        console.log(name[0]);
        console.log(name[1]);
        console.log(name[2]);
        console.log(name[3]);
        console.log(name[4]);

        console.log("========= Inside Loop ============")
        for(var i =0;i<name.length;i++)
        {
            console.log(name[i]);
        }

        name.push("Nidhi");

        console.log("After Adding Nidhi");
        console.log(name);

        var food = [];
        food[0] = "Pizza";
        food[1] = "Coffee";

        console.log(food);

        const color = new Array("Blue","Red","Green","Purple","Pink");
        console.log("Colors : "+ color[1]);

        for(var i = 0 ; i<color.length;i++)
        {
            console.log("Color ["+i+"] =>"+color[i]);
        }
    }
</script>
<body>
    <button id="btnShow" onclick="arrayDemo()">Display Array</button>
</body>
</html>
