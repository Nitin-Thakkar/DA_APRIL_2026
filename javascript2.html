<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Demo 2</title>
    <script>
        function greet()
        {
            console.log("Greet Function Called!!")
            var name = document.getElementById('txtFullName').value
            // alert("Welcome "+name);
            document.getElementById('result').innerHTML="Welcome "+name
            

        }
    </script>
</head>
<body>
    <label>Name :</label>
    <input type="text" id="txtFullName" name="txtFullName" placeholder="Enter Your Full Name">
    <br><br>

    <button id="btnGreet" onclick="greet()">Greet</button>

    <p id="result">Display Message</p>
</body>
</html>
